<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Профориентация: интересы, мышление, характер и подходящие профессии. Семь коротких тестов.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fafafa'%3E%D0%9F%3C/text%3E%3C/svg%3E">
<title>Профориентация — диагностический комплекс</title>
<style>
/* ============================================================
   ТОКЕНЫ (shadcn/ui, нейтральная тема)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --radius:.625rem;
  --bg:#ffffff; --fg:#09090b;
  --card:#ffffff; --card-fg:#09090b;
  --muted:#f4f4f5; --muted-fg:#71717a;
  --border:#e4e4e7; --input:#e4e4e7;
  --primary:#18181b; --primary-fg:#fafafa;
  --secondary:#f4f4f5; --secondary-fg:#18181b;
  --accent:#f4f4f5; --accent-fg:#18181b;
  --destructive:#ef4444; --destructive-fg:#fafafa;
  --ring:#a1a1aa;
  --success:#16a34a; --warning:#d97706;
  --chart-1:#2563eb; --chart-2:#7c3aed; --chart-3:#db2777; --chart-4:#ea580c;
  --chart-5:#0891b2; --chart-6:#16a34a; --chart-7:#ca8a04; --chart-8:#64748b;
  --chart-9:#dc2626; --chart-10:#4f46e5;
  --shadow:0 1px 2px 0 rgb(0 0 0 / .05);
}
[data-theme="dark"]{
  --bg:#09090b; --fg:#fafafa;
  --card:#0f0f11; --card-fg:#fafafa;
  --muted:#1c1c1f; --muted-fg:#a1a1aa;
  --border:#27272a; --input:#27272a;
  --primary:#fafafa; --primary-fg:#18181b;
  --secondary:#27272a; --secondary-fg:#fafafa;
  --accent:#27272a; --accent-fg:#fafafa;
  --destructive:#991b1b; --destructive-fg:#fafafa;
  --ring:#52525b;
  --success:#22c55e; --warning:#f59e0b;
  --chart-1:#60a5fa; --chart-2:#a78bfa; --chart-3:#f472b6; --chart-4:#fb923c;
  --chart-5:#22d3ee; --chart-6:#4ade80; --chart-7:#facc15; --chart-8:#94a3b8;
  --chart-9:#f87171; --chart-10:#818cf8;
  --shadow:0 1px 2px 0 rgb(0 0 0 / .4);
}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.25}
p{margin:0 0 .75em}
a{color:inherit}
::selection{background:var(--primary);color:var(--primary-fg)}

/* ============================================================
   ЛЭЙАУТ
   ============================================================ */
.container{max-width:920px;margin:0 auto;padding:0 20px}
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.header-inner{display:flex;align-items:center;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;background:none;border:0;color:inherit;font-family:inherit}
.brand-mark{
  width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-fg);
  display:grid;place-items:center;font-size:13px;font-weight:700;
}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav-link{
  background:none;border:0;font:inherit;font-size:13.5px;color:var(--muted-fg);
  padding:6px 10px;border-radius:calc(var(--radius) - 3px);cursor:pointer;transition:.15s;
}
.nav-link:hover{background:var(--accent);color:var(--accent-fg)}
.nav-link.active{color:var(--fg);background:var(--muted);font-weight:500}
main{padding:32px 0 80px}
.footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted-fg);font-size:12.5px}
.footer .container{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}

/* ============================================================
   КНОПКИ
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  white-space:nowrap;border-radius:calc(var(--radius) - 2px);
  font-family:inherit;font-size:.875rem;font-weight:500;height:2.25rem;padding:0 1rem;
  border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s,opacity .15s;
  user-select:none;
}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,transparent)}
.btn-outline{border-color:var(--border);background:var(--bg)}
.btn-outline:hover{background:var(--accent);color:var(--accent-fg)}
.btn-ghost:hover{background:var(--accent);color:var(--accent-fg)}
.btn-destructive{background:var(--destructive);color:var(--destructive-fg)}
.btn-destructive:hover{opacity:.9}
.btn-sm{height:2rem;padding:0 .7rem;font-size:.8125rem;border-radius:calc(var(--radius) - 4px)}
.btn-lg{height:2.75rem;padding:0 1.5rem;font-size:.95rem}
.btn-icon{height:2.25rem;width:2.25rem;padding:0}
.btn-block{width:100%}

/* ============================================================
   КАРТОЧКИ / ПРОЧЕЕ
   ============================================================ */
.card{background:var(--card);color:var(--card-fg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:20px 20px 0}
.card-title{font-size:1rem;font-weight:600}
.card-desc{font-size:.85rem;color:var(--muted-fg);margin-top:4px}
.card-content{padding:20px}
.card-footer{padding:0 20px 20px;display:flex;gap:8px;flex-wrap:wrap}
.separator{height:1px;background:var(--border);margin:20px 0}
.badge{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  border:1px solid var(--border);background:var(--muted);color:var(--muted-fg);
  padding:2px 9px;font-size:11.5px;font-weight:500;line-height:1.5;white-space:nowrap;
}
.badge-primary{background:var(--primary);color:var(--primary-fg);border-color:transparent}
.badge-success{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);border-color:color-mix(in srgb,var(--success) 30%,transparent)}
.badge-warning{background:color-mix(in srgb,var(--warning) 15%,transparent);color:var(--warning);border-color:color-mix(in srgb,var(--warning) 30%,transparent)}
.badge-muted{background:var(--muted);color:var(--muted-fg)}
.muted{color:var(--muted-fg)}
.small{font-size:.8125rem}
.tiny{font-size:.75rem}
.mono{font-variant-numeric:tabular-nums}
.progress{height:6px;width:100%;background:var(--muted);border-radius:999px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:999px;transition:width .3s ease}
.kbd{
  display:inline-grid;place-items:center;width:22px;height:22px;flex:0 0 22px;
  border-radius:6px;background:var(--muted);color:var(--muted-fg);
  font-size:11px;font-weight:600;
}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}

/* ============================================================
   ГЛАВНАЯ
   ============================================================ */
.hero{padding:8px 0 28px}
.hero h1{font-size:30px;line-height:1.15;letter-spacing:-.03em}
.hero p{color:var(--muted-fg);max-width:640px;margin-top:10px;font-size:15px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.test-card{display:flex;flex-direction:column;gap:14px;padding:18px;transition:border-color .15s,transform .15s}
.test-card:hover{border-color:color-mix(in srgb,var(--fg) 25%,var(--border))}
.test-card .tc-icon{font-size:22px;line-height:1}
.test-card h3{font-size:15px}
.test-card .tc-meta{font-size:12px;color:var(--muted-fg);margin-top:4px}
.test-card .tc-body{font-size:13px;color:var(--muted-fg);flex:1}

/* ============================================================
   ВОПРОСЫ
   ============================================================ */
.test-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.test-head h1{font-size:20px;flex:1;min-width:min(200px,100%)}
.q-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.q-progress .progress{flex:1}
.q-counter{font-size:12.5px;color:var(--muted-fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.question-card{padding:26px}
.q-num{font-size:12px;color:var(--muted-fg);letter-spacing:.02em;font-weight:500}
.q-text{font-size:19px;line-height:1.45;margin-top:12px;font-weight:500;letter-spacing:-.01em}
.options{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.options-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.options-2{grid-template-columns:1fr}}
.option{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);color:inherit;font:inherit;cursor:pointer;
  transition:background .15s,border-color .15s,box-shadow .15s;
}
.option:hover{background:var(--accent)}
.option[aria-pressed="true"]{
  border-color:var(--fg);
  box-shadow:0 0 0 1px var(--fg);
  background:var(--accent);
}
.option .kbd{transition:.15s}
.option[aria-pressed="true"] .kbd{background:var(--primary);color:var(--primary-fg)}
.option-text{flex:1;font-size:14.5px;line-height:1.45}
.option .opt-code{margin-left:auto;flex:0 0 auto}
.q-nav{display:flex;align-items:center;gap:10px;margin-top:20px}
.q-nav .spacer{flex:1}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:14px}
.qbtn{
  height:36px;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);
  background:var(--card);color:var(--muted-fg);font:inherit;font-size:12.5px;
  cursor:pointer;transition:.15s;font-variant-numeric:tabular-nums;
}
.qbtn:hover{background:var(--accent)}
.qbtn.answered{background:var(--primary);color:var(--primary-fg);border-color:transparent}
.qbtn.current{outline:2px solid var(--ring);outline-offset:1px}
.hint{margin-top:16px;font-size:12.5px;color:var(--muted-fg)}

/* ============================================================
   РЕЗУЛЬТАТЫ
   ============================================================ */
.scale-row{margin-bottom:16px}
.scale-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.scale-name{font-size:13.5px;font-weight:500}
.scale-val{font-size:12.5px;color:var(--muted-fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--muted);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.lead-box{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;background:var(--muted);
}
.lead-box h3{font-size:17px}
.prof-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prof{
  font-size:12.5px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);
}
.result-block + .result-block{margin-top:22px}
.result-block > h3{font-size:13px;margin-bottom:10px;color:var(--fg);font-weight:600}

/* ============================================================
   МАТРИЦА
   ============================================================ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--border);background:var(--card);color:inherit;
  font:inherit;font-size:13.5px;padding:9px 14px;border-radius:999px;cursor:pointer;
  transition:.15s;
}
.chip:hover{background:var(--accent)}
.chip.sel{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:500}
.matrix-result{
  margin-top:20px;padding:20px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--muted);
}
.matrix-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
.matrix-table th,.matrix-table td{border:1px solid var(--border);padding:8px;vertical-align:top;text-align:left}
.matrix-table th{background:var(--muted);font-weight:600;font-size:11.5px;position:sticky;top:0}
.matrix-table td{min-width:120px}
.table-scroll{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:var(--radius)}

/* ============================================================
   ИСТОРИЯ / НАСТРОЙКИ
   ============================================================ */
.hist-item{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
.hist-item + .hist-item{margin-top:10px}
.hist-main{flex:1;min-width:0}
.hist-title{font-size:14px;font-weight:600}
.hist-meta{font-size:12px;color:var(--muted-fg);margin-top:2px}
textarea{
  width:100%;min-height:130px;resize:vertical;padding:12px 14px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);color:inherit;font:inherit;font-size:14px;line-height:1.5;
}
textarea:focus{outline:2px solid var(--ring);outline-offset:1px;border-color:transparent}
input[type=text]{
  padding:8px 12px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);
  background:var(--card);color:inherit;font:inherit;font-size:14px;
}
input[type=text]:focus{outline:2px solid var(--ring);outline-offset:1px}
.empty{text-align:center;padding:56px 20px;color:var(--muted-fg)}
.empty .big{font-size:34px;margin-bottom:12px;opacity:.5}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:none}
#app.enter .fade{animation:fadeUp .22s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ============================================================
   ДОПОЛНЕНИЯ: доступность, адаптив, печать, диалоги
   ============================================================ */
html{color-scheme:light;scroll-behavior:auto}
[data-theme="dark"]{color-scheme:dark}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
main:focus,#q-card:focus{outline:none}
.skip-link{position:absolute;left:12px;top:-60px;z-index:100;background:var(--primary);color:var(--primary-fg);padding:8px 14px;border-radius:8px;text-decoration:none;font-size:13px;transition:top .15s}
.skip-link:focus{top:8px}

.eyebrow{font-size:12px;color:var(--muted-fg);font-weight:500}

/* шапка на узких экранах */
.nav{min-width:0}
@media(max-width:620px){
  .header-inner{gap:8px}
  .container{padding:0 14px}
  .question-card{padding:18px}
  .q-text{font-size:17px}
  .hero h1{font-size:25px}
}

/* баннер, тосты, диалог */
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--warning) 40%,var(--border));background:color-mix(in srgb,var(--warning) 10%,var(--card));color:var(--fg);border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--primary);color:var(--primary-fg);padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgb(0 0 0/.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--card-fg);padding:0;max-width:min(420px,calc(100vw - 32px));box-shadow:0 20px 50px rgb(0 0 0/.3)}
dialog::backdrop{background:rgb(0 0 0/.45)}
dialog form{padding:20px}
dialog p{margin:0 0 18px;font-size:14.5px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}

/* переключатель */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.switch{position:relative;width:40px;height:22px;flex:0 0 40px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--input);border:1px solid var(--border);transition:.15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgb(0 0 0/.3);transition:.15s}
.switch input:checked + i{background:var(--primary);border-color:transparent}
.switch input:checked + i::after{transform:translateX(18px);background:var(--primary-fg)}
.switch input:focus-visible + i{outline:2px solid var(--ring);outline-offset:2px}

/* матрица: закреплённый первый столбец и подсветка */
.matrix-table th:first-child{position:sticky;left:0;z-index:1;background:var(--muted);min-width:130px}
.matrix-table thead th:first-child{z-index:2}
.matrix-table td.hit{background:color-mix(in srgb,var(--chart-1) 14%,var(--card));outline:2px solid var(--chart-1);outline-offset:-2px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:500}

.profile-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.profile-row:first-child{border-top:0}
.profile-row .pr-main{flex:1;min-width:0}
.accent-block{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);margin-top:10px}
.accent-block p{margin:.3em 0 0}

/* печать */
/* ---- Окно «Поделиться» ---- */
#share-dlg{max-width:min(460px,calc(100vw - 32px));width:100%;max-height:calc(100vh - 32px);overflow:auto}
.share-box{padding:18px 20px 20px}
.share-box h2{font-size:16px}
.share-canvas{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--border);margin:14px 0 10px;background:#fff}
.share-note{font-size:12px;color:var(--muted-fg);margin:0 0 14px}
.share-box .stack .btn{width:100%}
@media print{
  .site-header,.footer,.no-print,#toast,.skip-link{display:none !important}
  body{background:#fff;color:#000}
  main{padding:0}
  .card,.lead-box{box-shadow:none;break-inside:avoid}
  .bar,.progress{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .bar > i{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}

/* даты и время не выходят за границы контейнера */
.test-card .row,.hist-item .row{flex-wrap:wrap}
.test-card .row > .tiny,.hist-meta,.test-head .badge{min-width:0;max-width:100%;overflow-wrap:anywhere}
.test-head .badge{white-space:normal;flex:0 1 auto}
.test-card .row > .tiny{flex:1 1 auto}
.hist-main,.hist-item{min-width:0}
.hist-meta{font-variant-numeric:tabular-nums}

/* иконки (Lucide) */
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.btn .ico{width:1.1em;height:1.1em}
.btn-icon .ico{width:1.2rem;height:1.2rem}
.test-card .tc-icon{width:40px;height:40px;border-radius:10px;background:var(--muted);border:1px solid var(--border);display:grid;place-items:center;font-size:20px;color:var(--fg)}
.test-card .tc-icon .ico{width:21px;height:21px}
.hist-item > .hi-icon,.profile-row > .pr-icon{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--muted);border:1px solid var(--border);display:grid;place-items:center;font-size:18px}
.empty .big .ico{width:36px;height:36px}
.banner .ico{width:18px;height:18px;margin-top:1px;color:var(--warning)}

/* навигация в шапке: текст + иконка, на мобилке только иконки */
.nav-link{display:inline-flex;align-items:center;gap:7px}
.nav-link .ico{width:16px;height:16px;flex:0 0 16px}
.nav-count{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:11px;font-weight:600;display:inline-grid;place-items:center;line-height:1}
@media(max-width:620px){
  .nav-link{width:2.25rem;height:2.25rem;padding:0;justify-content:center;position:relative}
  .nav-link .ico{width:20px;height:20px;flex-basis:20px}
  .nav-label{display:none}

}

  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const pairs = [];
    for(let i = 0; i < cur.length; i += 2) pairs.push([cur[i], cur[i+1]]);
    const answeredInRound = picks.length - pi;
    if(answeredInRound < pairs.length){
      return {done:false, round, totalRounds, pairs, current: pairs[answeredInRound], index: answeredInRound};
    }
    cur = pairs.map((p,i) => picks[pi+i]);
    pi += pairs.length; round++;
  }
  return {done:true, winner: cur[0]};
}

/* ---- подсчёты по ответам ---- */
function countAnswers(test, a){
  a = a || {};
  if(test.kind === 'tournament') return (a.picks || []).length;
  if(test.kind === 'matrix')     return (a.object && a.activity) ? 1 : 0;
  if(test.kind === 'reflection') return (a.text || '').trim() ? 1 : 0;
  return Object.values(a).filter(v => v !== undefined && v !== null).length;
}
function totalCount(test){
  if(test.kind === 'tournament') return MOTIVES.length - 1;
  if(isQuestionTest(test)) return test.questions.length;
  return 1;
}

/* ---- очистка данных ---- */
function sanitizeAnswers(test, raw){
  raw = raw && typeof raw === 'object' ? raw : {};
  const out = {};
  switch(test.kind){
    case 'binary':
      test.questions.forEach((_,i) => { if(raw[i] === 'yes' || raw[i] === 'no') out[i] = raw[i]; });
      return out;
    case 'choice':
      test.questions.forEach((q,i) => { const v = Number(raw[i]); if(raw[i] !== null && raw[i] !== undefined && raw[i] !== '' && Number.isInteger(v) && v >= 0 && v < q.options.length) out[i] = v; });
      return out;
    case 'pairs':
      test.questions.forEach((_,i) => { if(raw[i] === 'a' || raw[i] === 'b') out[i] = raw[i]; });
      return out;
    case 'matrix':
      if(M_OBJECTS.includes(raw.object))   out.object = raw.object;
      if(M_ACTS.includes(raw.activity))    out.activity = raw.activity;
      return out;
    case 'tournament': {
      const picks = [];
      if(Array.isArray(raw.picks)){
        for(const p of raw.picks){
          const st = tournamentState(picks);
          if(st.done || !st.current.includes(p)) break;
          picks.push(p);
        }
      }
      return {picks};
    }
    case 'reflection':
      return {text: typeof raw.text === 'string' ? raw.text.trim().slice(0, NOTE_LIMIT) : ''};
  }
  return out;
}
function sanitizeResult(r){
  if(!r || typeof r !== 'object') return null;
  const t = getTest(r.testId);
  if(!t) return null;
  let src = r.answers;
  if(t.kind === 'reflection' && !(src && typeof src.text === 'string')) src = {text: r.extra && r.extra.text};
  const answers = sanitizeAnswers(t, src);
  if(countAnswers(t, answers) < totalCount(t)) return null;
  const d = new Date(r.date);
  return {
    id: typeof r.id === 'string' && /^[\w-]{1,40}$/.test(r.id) ? r.id : uid(),
    testId: t.id,
    date: isNaN(d) ? new Date().toISOString() : d.toISOString(),
    answers
  };
}
const defaultState = () => ({answers:{}, pos:{}, results:[], notes:{}, theme:'system', autoAdvance:true});
function sanitizeState(p){
  const s = defaultState();
  if(!p || typeof p !== 'object') return s;
  if(['light','dark','system'].includes(p.theme)) s.theme = p.theme;
  if(typeof p.autoAdvance === 'boolean') s.autoAdvance = p.autoAdvance;
  TESTS.forEach(t => {
    if(p.answers && t.kind !== 'reflection' && p.answers[t.id]) s.answers[t.id] = sanitizeAnswers(t, p.answers[t.id]);
    if(p.pos && Number.isInteger(p.pos[t.id]) && p.pos[t.id] >= 0) s.pos[t.id] = p.pos[t.id];
    if(p.notes && typeof p.notes[t.id] === 'string') s.notes[t.id] = p.notes[t.id].slice(0, NOTE_LIMIT);
  });
  const seen = new Set();
  (Array.isArray(p.results) ? p.results : []).slice(0, 500).forEach(r => {
    const res = sanitizeResult(r);
    if(res && !seen.has(res.id)){ seen.add(res.id); s.results.push(res); }
  });
  return s;
}

/* ============================================================
   4. ХРАНИЛИЩЕ
   ============================================================ */
const STORE_KEY = 'proforient.v3';
const OLD_KEYS = ['proforient.v2'];
let storageOK = true;
let S = loadState();

function loadState(){
  try{
    let raw = localStorage.getItem(STORE_KEY);
    if(!raw){
      for(const k of OLD_KEYS){ raw = localStorage.getItem(k); if(raw) break; }
    }
    if(raw) return sanitizeState(JSON.parse(raw));
  }catch(e){
    storageOK = false;
    console.warn('Не удалось прочитать сохранения', e);
  }
  return defaultState();
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer); saveTimer = null;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
  }catch(e){
    if(storageOK){ storageOK = false; render(); }
    console.warn('Не удалось сохранить', e);
  }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
window.addEventListener('pagehide', () => { if(saveTimer) save(); });
document.addEventListener('visibilitychange', () => { if(document.hidden && saveTimer) save(); });
try{ localStorage.setItem('proforient.probe','1'); localStorage.removeItem('proforient.probe'); }catch(e){ storageOK = false; }

const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const effectiveTheme = () => S.theme === 'system' ? (mq && mq.matches ? 'dark' : 'light') : S.theme;
function applyTheme(){
  const t = effectiveTheme();
  document.documentElement.dataset.theme = t;
  const m = $('meta[name="theme-color"]');
  if(m) m.content = t === 'dark' ? '#09090b' : '#ffffff';
}
if(mq && mq.addEventListener) mq.addEventListener('change', () => { if(S.theme === 'system') applyTheme(); });

/* ---- результаты ---- */
const lastResult = testId => S.results.find(r => r.testId === testId);
function stateAnswers(test){
  if(test.kind === 'reflection') return {text: (S.notes[test.id] || '')};
  return S.answers[test.id] || {};
}
const answeredCount = test => countAnswers(test, stateAnswers(test));
const isComplete = test => answeredCount(test) >= totalCount(test);

function ensureResult(test){
  const answers = sanitizeAnswers(test, stateAnswers(test));
  const last = lastResult(test.id);
  if(last && JSON.stringify(last.answers) === JSON.stringify(answers)) return last;
  const res = {id: uid(), testId: test.id, date: new Date().toISOString(), answers: JSON.parse(JSON.stringify(answers))};
  S.results.unshift(res);
  save();
  return res;
}
function answersMatch(test, res){
  return JSON.stringify(sanitizeAnswers(test, stateAnswers(test))) === JSON.stringify(res.answers);
}
function clearTestAnswers(test){
  delete S.answers[test.id];
  if(test.kind === 'reflection') delete S.notes[test.id];
  S.pos[test.id] = 0;
  save();
}

function analyze(test, answers){
  if(test.kind === 'matrix'){
    const profs = (MATRIX[answers.activity] && MATRIX[answers.activity][answers.object]) || [];
    return {lead:{name:`${answers.activity} · ${answers.object}`}, professions:profs};
  }
  if(test.kind === 'tournament'){
    const st = tournamentState(answers.picks || []);
    const winner = st.done ? MOTIVES[st.winner] : '';
    return {lead:{name:winner}, winner, picks:(answers.picks || []).map(i => MOTIVES[i])};
  }
  if(test.kind === 'reflection'){
    return {lead:{name:'Рефлексивная заметка'}, text:answers.text || ''};
  }
  return test.compute(answers);
}

/* ============================================================
   5. МАРШРУТИЗАЦИЯ И РЕНДЕР
   ============================================================ */
let route = {name:'home'};
let pendingRoute = null;
let advanceTimer = null;
const clearAdvance = () => { clearTimeout(advanceTimer); advanceTimer = null; };

function routeToHash(r){
  switch(r.name){
    case 'history':  return '#/history';
    case 'settings': return '#/settings';
    case 'test':     return `#/test/${r.id}`;
    case 'result':   return `#/result/${r.id}` + (r.rid ? `/${r.rid}` : '');
    default:         return '#/';
  }
}
function hashToRoute(h){
  const p = h.replace(/^#\/?/, '').split('/').filter(Boolean);
  if(p[0] === 'history')  return {name:'history'};
  if(p[0] === 'settings') return {name:'settings'};
  if(p[0] === 'test' && getTest(p[1])) return {name:'test', id:p[1]};
  if(p[0] === 'result' && getTest(p[1])) return {name:'result', id:p[1], rid:/^[\w-]{1,40}$/.test(p[2] || '') ? p[2] : null};
  return {name:'home'};
}
function normalizeRoute(){
  if(route.name === 'test'){
    const t = getTest(route.id);
    if(!t){ route = {name:'home'}; return; }
    if(isQuestionTest(t)) route.q = clamp(route.q ?? S.pos[t.id] ?? 0, 0, t.questions.length - 1);
  }
  if(route.name === 'result'){
    const t = getTest(route.id);
    const res = t && (S.results.find(r => r.id === route.rid && r.testId === t.id) || lastResult(t.id));
    if(!res){ route = {name:'home'}; return; }
    route.rid = res.id;
  }
}
function setRoute(r){
  clearAdvance();
  route = r;
  normalizeRoute();
  render({enter:true, focusMain:true});
  window.scrollTo(0, 0);
}
function go(r){
  clearAdvance();
  const h = routeToHash(r);
  const cur = location.hash || '#/';
  if(cur === h || (h === '#/' && cur === '#')){ setRoute(r); return; }
  pendingRoute = r;
  try{ location.hash = h; }catch(e){ pendingRoute = null; setRoute(r); return; }
  setTimeout(() => { if(pendingRoute){ const p = pendingRoute; pendingRoute = null; setRoute(p); } }, 60);
}
window.addEventListener('hashchange', () => {
  const r = pendingRoute && routeToHash(pendingRoute) === location.hash ? pendingRoute : hashToRoute(location.hash);
  pendingRoute = null;
  setRoute(r);
});
function setQ(test, i){
  route.q = clamp(i, 0, test.questions.length - 1);
  S.pos[test.id] = route.q;
  save();
}

function titleFor(){
  const base = 'Профориентация';
  if(route.name === 'test' || route.name === 'result'){
    const t = getTest(route.id);
    if(t) return `${t.title}${route.name === 'result' ? ' — результат' : ''} · ${base}`;
  }
  if(route.name === 'history')  return `Результаты · ${base}`;
  if(route.name === 'settings') return `Настройки · ${base}`;
  return `${base} — диагностический комплекс`;
}

}
function firstUnanswered(test){
  const a = S.answers[test.id] || {};
  for(let i = 0; i < test.questions.length; i++) if(a[i] === undefined || a[i] === null) return i;
  return -1;
}
function viewQuestions(test){
  const total = test.questions.length;
  const qi = route.q;
  const answers = S.answers[test.id] || {};
  const done = countAnswers(test, answers);
  const q = test.questions[qi];
  const cur = answers[qi];
  const complete = done >= total;

  let optionsHTML = '';

function answerQuestion(test, raw){
  if(route.name !== 'test' || route.id !== test.id || !isQuestionTest(test)) return;
  clearAdvance();
  const qi = route.q;
  const stored = test.kind === 'choice' ? Number(raw) : raw;
  if(!S.answers[test.id]) S.answers[test.id] = {};
  S.answers[test.id][qi] = stored;
  save();
  render({focus:`[data-action="answer"][data-value="${raw}"]`});
  if(S.autoAdvance && qi < test.questions.length - 1){
    advanceTimer = setTimeout(() => {
      if(route.name !== 'test' || route.id !== test.id || route.q !== qi) return;
      setQ(test, qi + 1);
      render({enter:true, focus:'#q-card'});
    }, 260);
  }
}

  clearAdvance();
  setQ(test, i);
  render({enter:true, focus:'#q-card'});
}

/* ---------------- Тест: матрица ---------------- */
function viewMatrix(test){
  const a = S.answers[test.id] || {};
  const obj = a.object, act = a.activity;
  const profs = (obj && act) ? (MATRIX[act][obj] || []) : null;

  return 'баллов';
}

function finishTest(test){
  clearAdvance();
  if(!isComplete(test)){
    const i = firstUnanswered(test);
    toast('Осталось ответить на ' + (totalCount(test) - answeredCount(test)));
    if(i >= 0) moveQ(test, i);
    return;
  }
  const res = ensureResult(test);
  go({name:'result', id:test.id, rid:res.id});
}
async function resetTest(test){
  if(isComplete(test)){
    ensureResult(test);
    clearTestAnswers(test);
    toast('Результат в истории, ответы сброшены');
  } else {
    if(answeredCount(test) > 0 && !(await confirmDialog('Сбросить ответы по этой методике?', 'Сбросить', true))) return;
    clearTestAnswers(test);
  }
  if(route.name === 'test'){ route.q = 0; route.showGrid = false; render({enter:true, focusMain:true}); window.scrollTo(0,0); }
  else go({name:'test', id:test.id});
}

/* ============================================================
   ПОДЕЛИТЬСЯ: карточка-картинка + текст в стиле Wordle (без сервера)
   ============================================================ */
const SHARE_COLORS = ['#2563eb','#7c3aed','#db2777','#ea580c','#0891b2','#16a34a','#ca8a04','#64748b','#dc2626','#4f46e5'];
const SHARE_FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
let shareCtx = null;
function shareColor(c){ const m = /--chart-(\d+)/.exec(c || ''); return (m && SHARE_COLORS[Number(m[1]) - 1]) || SHARE_COLORS[0]; }
function shareUrl(){ return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : ''; }

function buildShare(t, answers, date){
  const info = analyze(t, answers);
  const d = {title:t.title, date, eyebrow:'Главное', lead:(info.lead && info.lead.name) || '', badges:[], bars:[], chips:[], chipsTitle:''};
  if(t.kind === 'matrix'){
    d.eyebrow = 'Мой выбор';
    d.chips = (info.professions || []).slice();
    d.chipsTitle = 'Подходящие профессии';
  } else if(t.kind === 'tournament'){
    d.eyebrow = 'Главный мотив';
    d.lead = info.winner || d.lead;
    const picks = info.picks || [];
    if(picks.length === 15){ d.chips = picks.slice(8, 12); d.chipsTitle = 'В четвёрке лучших'; }
  } else {
    if(info.lead && info.lead.value != null){
      d.badges.push(`${info.lead.value} ${plural(info.lead.value)}`);
      if(info.lead.level) d.badges.push(info.lead.level);
    }
    d.bars = (info.scales || []).map(s => ({name:s.name, value:s.value, max:s.max, color:shareColor(s.color)}));
  }
  return d;
}

function shareText(d){
  const L = ['🧭 ' + d.title, ''];
  L.push(`${d.eyebrow}: ${d.lead}` + (d.badges.length ? ` — ${d.badges.join(', ')}` : ''));
  if(d.bars.length){
    L.push('');
    d.bars.forEach(b => {
      const n = b.max ? Math.round(b.value / b.max * 8) : 0;
      L.push(`${'█'.repeat(n)}${'░'.repeat(8 - n)} ${b.value}/${b.max} ${b.name}`);
    });
  }
  if(d.chips.length) L.push('', `${d.chipsTitle}: ${d.chips.slice(0, 8).join(', ')}`);
  const u = shareUrl(); if(u) L.push('', u);
  return L.join('\n');
}

function wrapLines(x, text, maxW, maxLines){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for(const w of words){
    const tryLine = cur ? cur + ' ' + w : w;
    if(!cur || x.measureText(tryLine).width <= maxW) cur = tryLine;
    else { lines.push(cur); cur = w; }
  }
  if(cur) lines.push(cur);
  if(lines.length > maxLines){
    lines.length = maxLines;
    let l = lines[maxLines - 1];
    while(l.length && x.measureText(l + '…').width > maxW) l = l.slice(0, -1);
    lines[maxLines - 1] = l + '…';
  }
  return lines.length ? lines : [''];
}
function rrect(x, px, py, w, h, r){ x.beginPath(); if(x.roundRect) x.roundRect(px, py, w, h, r); else x.rect(px, py, w, h); }

function drawShareCard(d){
  const W = 1080, H = 1350, P = 72, F = SHARE_FONT;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#18181b'; x.fillRect(0, 0, W, 12);

  // шапка
  x.fillStyle = '#18181b'; rrect(x, P, P, 60, 60, 16); x.fill();
  x.fillStyle = '#fafafa'; x.font = `700 32px ${F}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('П', P + 30, P + 32);
  x.textAlign = 'left'; x.fillStyle = '#18181b'; x.font = `600 30px ${F}`;
  x.fillText('Профориентация', P + 78, P + 32);
  x.textAlign = 'right'; x.fillStyle = '#71717a'; x.font = `400 26px ${F}`;
  x.fillText(d.date || '', W - P, P + 32);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';

  // название методики
  let y = 238;
  x.fillStyle = '#71717a'; x.font = `600 26px ${F}`;
  x.fillText(wrapLines(x, d.title.toUpperCase(), W - 2 * P, 1)[0], P, y);

  // блок «главное»
  const by = y + 34, bw = W - 2 * P, pad = 48, innerW = bw - 2 * pad;
  let fs = 64, lines;
  for(;;){
    x.font = `700 ${fs}px ${F}`;
    lines = wrapLines(x, d.lead, innerW, 3);
    const fits = lines.every(l => x.measureText(l).width <= innerW) && !lines[lines.length - 1].endsWith('…');
    if(fits || fs <= 36) break;
    fs -= 4;
  }
  const lh = Math.round(fs * 1.2), base = Math.round(fs * 0.88);
  const bh = pad + 46 + lines.length * lh + (d.badges.length ? 64 : 0) + pad - 6;
  x.fillStyle = '#f4f4f5'; rrect(x, P, by, bw, bh, 28); x.fill();
  let cy = by + pad;
  x.fillStyle = '#71717a'; x.font = `600 24px ${F}`; x.fillText(d.eyebrow.toUpperCase(), P + pad, cy + 22);
  cy += 46;
  x.fillStyle = '#09090b'; x.font = `700 ${fs}px ${F}`;
  lines.forEach((l, i) => x.fillText(l, P + pad, cy + base + i * lh));
  cy += lines.length * lh;
  if(d.badges.length){
    let bx = P + pad; const pillY = cy + 8;
    d.badges.forEach((b, i) => {
      x.font = `600 26px ${F}`;
      const w = x.measureText(b).width + 40;
      x.fillStyle = i === 0 ? '#18181b' : '#e4e4e7'; rrect(x, bx, pillY, w, 48, 24); x.fill();
      x.fillStyle = i === 0 ? '#fafafa' : '#3f3f46'; x.fillText(b, bx + 20, pillY + 33);
      bx += w + 12;
    });
  }

  // содержимое
  y = by + bh + 60;
  const bottom = H - 150;
  if(d.bars.length){
    let rowH = Math.min(92, (bottom - y) / d.bars.length);
    const compact = rowH < 76;
    rowH = Math.max(rowH, 56);
    const n = Math.min(d.bars.length, Math.floor((bottom - y) / rowH));
    for(let i = 0; i < n; i++){
      const b = d.bars[i], ry = y + i * rowH;
      const nameY = ry + (compact ? 24 : 30), barY = ry + (compact ? 36 : 46), barH = compact ? 12 : 18;
      x.font = `500 ${compact ? 25 : 30}px ${F}`; x.fillStyle = '#18181b'; x.textAlign = 'left';
      x.fillText(wrapLines(x, b.name, W - 2 * P - 180, 1)[0], P, nameY);
      x.textAlign = 'right'; x.fillStyle = '#71717a'; x.font = `500 ${compact ? 24 : 28}px ${F}`;
      x.fillText(`${b.value} / ${b.max}`, W - P, nameY); x.textAlign = 'left';
      x.fillStyle = '#e4e4e7'; rrect(x, P, barY, W - 2 * P, barH, barH / 2); x.fill();
      const fw = Math.max(b.max ? (W - 2 * P) * b.value / b.max : 0, 0);
      if(fw > 0){ x.fillStyle = b.color; rrect(x, P, barY, Math.max(fw, barH), barH, barH / 2); x.fill(); }
    }
  }
  if(d.chips.length){
    x.fillStyle = '#71717a'; x.font = `600 24px ${F}`; x.fillText(d.chipsTitle.toUpperCase(), P, y);
    let px = P, py = y + 28; const chH = 56, gap = 14;
    x.font = `500 28px ${F}`;
    for(let i = 0; i < d.chips.length; i++){
      let label = d.chips[i];
      let w = x.measureText(label).width + 44;
      if(w > W - 2 * P){ label = wrapLines(x, label, W - 2 * P - 44, 1)[0]; w = W - 2 * P; }
      if(px + w > W - P){ px = P; py += chH + gap; }
      if(py + chH > bottom){
        const rest = `+ ещё ${d.chips.length - i}`;
        const rw = x.measureText(rest).width + 44;
        if(px + rw > W - P){ px = P; py += chH + gap; }
        if(py + chH <= bottom + 20){
          x.fillStyle = '#18181b'; rrect(x, px, py, rw, chH, chH / 2); x.fill();
          x.fillStyle = '#fafafa'; x.fillText(rest, px + 22, py + 38);
        }
        break;
      }
      x.fillStyle = '#f4f4f5'; rrect(x, px, py, w, chH, chH / 2); x.fill();
      x.strokeStyle = '#e4e4e7'; x.lineWidth = 2; x.stroke();
      x.fillStyle = '#18181b'; x.fillText(label, px + 22, py + 38);
      px += w + gap;
    }
  }

  // подвал
  x.fillStyle = '#e4e4e7'; x.fillRect(P, H - 110, W - 2 * P, 2);
  x.fillStyle = '#71717a'; x.font = `400 26px ${F}`;
  const u = shareUrl();
  x.fillText(u ? u.replace(/^https?:\/\//, '') : 'Профориентация · семь коротких тестов', P, H - 60);
  return c;
}

function canvasBlob(c){ return new Promise(res => c.toBlob(res, 'image/png')); }
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function openShare(t, res){
  const dlg = $('#share-dlg');
  const answers = res ? res.answers : S.answers[t.id];
  const d = buildShare(t, answers, res ? fmtDate(res.date) : '');
  const canvas = drawShareCard(d);
  const blob = await canvasBlob(canvas);
  const file = blob ? new File([blob], `proforient-${t.id}.png`, {type:'image/png'}) : null;
  const text = shareText(d);
  const canFile = !!(file && navigator.canShare && navigator.canShare({files:[file]}));
  const canCopyImg = !!(blob && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write);
  shareCtx = {t, d, blob, file, text, canFile};

  const view = $('#share-canvas');
  view.width = canvas.width; view.height = canvas.height;
  view.getContext('2d').drawImage(canvas, 0, 0);
  view.setAttribute('aria-label', text.replace(/\n+/g, '. '));

  $('#share-send').innerHTML = canFile ? `${ico('share')} Отправить картинку` : `${ico('download')} Скачать картинку`;
  const ci = $('#share-copy-img'); ci.hidden = !canCopyImg; ci.innerHTML = `${ico('clipboard-list')} Скопировать картинку`;
  $('#share-copy-text').innerHTML = `${ico('clipboard-list')} Скопировать текст`;
  if(typeof dlg.showModal === 'function'){ if(!dlg.open) dlg.showModal(); }
  else { try{ await navigator.clipboard.writeText(text); toast('Текст скопирован'); }catch(e){ toast('Не удалось поделиться'); } }
}
document.addEventListener('click', e => { const dlg = $('#share-dlg'); if(dlg && e.target === dlg) dlg.close(); });

const actions = {
  home(){ go({name:'home'}); },
  history(){ go({name:'history'}); },
  settings(){ go({name:'settings'}); },
  async share(el, t){
    if(!t) return;
    const res = el.dataset.rid ? S.results.find(r => r.id === el.dataset.rid) : null;
    try{ await openShare(t, res); }catch(e){ toast('Не удалось подготовить картинку'); }
  },
  'share-close'(){ const d = $('#share-dlg'); if(d && d.open) d.close(); },
  async 'share-send'(){
    if(!shareCtx) return;
    const {t, d, blob, file, text, canFile} = shareCtx;
    if(canFile){
      try{ await navigator.share({files:[file], title:t.title, text}); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    if(blob){ downloadBlob(blob, `proforient-${t.id}.png`); toast('Картинка сохранена'); }
  },
  async 'share-copy-img'(){
    if(!shareCtx || !shareCtx.blob) return;
    try{ await navigator.clipboard.write([new ClipboardItem({'image/png': shareCtx.blob})]); toast('Картинка скопирована'); }
    catch(e){ toast('Не удалось скопировать картинку'); }
  },
  async 'share-copy-text'(){
    if(!shareCtx) return;
    try{ await navigator.clipboard.writeText(shareCtx.text); toast('Текст скопирован'); }
    catch(e){ toast('Не удалось скопировать текст'); }
  },

  'set-theme'(el){ S.theme = el.dataset.value; save(); render(); },

  'open-test'(el, t){ if(t) go({name:'test', id:t.id}); },
  'open-result'(el, t){
    if(!t) return;
    let rid = el.dataset.rid;
    if(!rid){
      if(!isComplete(t) && !lastResult(t.id)){ go({name:'test', id:t.id}); return; }
      rid = (isComplete(t) ? ensureResult(t) : lastResult(t.id)).id;
    }
    go({name:'result', id:t.id, rid});
  },
  async restart(el, t){
    if(!t) return;
    if(isComplete(t)) ensureResult(t);
    clearTestAnswers(t);
    go({name:'test', id:t.id});
  },

  'toggle-grid'(){ route.showGrid = !route.showGrid; render(); },
  'toggle-table'(){ route.showTable = !route.showTable; render(); },

  answer(el, t){ if(t) answerQuestion(t, el.dataset.value); },
  prev(el, t){ if(t) moveQ(t, route.q - 1); },
  next(el, t){ if(t) moveQ(t, route.q + 1); },
  goto(el, t){ if(t) moveQ(t, Number(el.dataset.index)); },
  'goto-missing'(el, t){ if(t){ const i = firstUnanswered(t); if(i >= 0) moveQ(t, i); } },
  'reset-test'(el, t){ if(t) resetTest(t); },
  finish(el, t){ if(t) finishTest(t); },

  'matrix-obj'(el, t){ (S.answers[t.id] ||= {}).object = el.dataset.value; save(); render(); },
  'matrix-act'(el, t){ (S.answers[t.id] ||= {}).activity = el.dataset.value; save(); render(); },
  'save-matrix'(el, t){
    if(!isComplete(t)) return;
    const res = ensureResult(t);
    toast('Результат сохранён');
    go({name:'result', id:t.id, rid:res.id});
  },

  'motive-pick'(el, t){ motivePick(t, Number(el.dataset.value)); },
  'motive-back'(el, t){ motiveBack(t); },
  'save-tournament'(el, t){
    if(!isComplete(t)) return;
    const res = ensureResult(t);
    toast('Результат сохранён');
    go({name:'result', id:t.id, rid:res.id});
  },

  'save-note'(el, t){
    if(!(S.notes[t.id] || '').trim()){ toast('Сначала что-нибудь напишите'); return; }
    const res = ensureResult(t);
    toast('Сохранено в результаты');
    go({name:'result', id:t.id, rid:res.id});
  },

  async 'delete-result'(el){
    const rid = el.dataset.rid;
    if(!(await confirmDialog('Удалить эту запись?', 'Удалить', true))) return;
    const res = S.results.find(r => r.id === rid);
    S.results = S.results.filter(r => r.id !== rid);
    const t = res && getTest(res.testId);
    if(t && isComplete(t) && answersMatch(t, res)) clearTestAnswers(t);
    save();
    if(route.name === 'result') go({name:'history'}); else render();
  },
  async 'clear-results'(){
    if(!(await confirmDialog('Удалить все результаты?', 'Удалить всё', true))) return;
    S.results = [];
    TESTS.forEach(t => { if(isComplete(t)) clearTestAnswers(t); });
    save(); render();
  },
  async 'clear-all'(){
    if(!(await confirmDialog('Удалить все данные — ответы, заметки и результаты? Вернуть их не получится.', 'Удалить всё', true))) return;
    const theme = S.theme;
    S = defaultState(); S.theme = theme;
    save(); go({name:'home'}); toast('Данные удалены');
  },

  export(){
    const data = JSON.stringify({app:'proforient', version:3, exported:new Date().toISOString(), ...S}, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    a.download = `proforient-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  import(){ const inp = $('#import-file'); inp.value = ''; inp.click(); }
};

function motivePick(test, idx){
  if(!test || test.kind !== 'tournament') return;
  const st = S.answers[test.id] || (S.answers[test.id] = {picks:[]});
  st.picks = st.picks || [];
  const state = tournamentState(st.picks);
  if(state.done || !state.current.includes(idx)) return;
  st.picks.push(idx);
  save();
  render({enter:true, focus: tournamentState(st.picks).done ? '#main' : '#q-card'});
}
function motiveBack(test){
  const st = S.answers[test.id];
  if(st && st.picks && st.picks.length){ st.picks.pop(); save(); render({enter:true, focus:'#q-card'}); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = actions[el.dataset.action];
  if(!fn) return;
  const test = getTest(el.dataset.id) || (route.id ? getTest(route.id) : null);
  fn(el, test);
});

document.addEventListener('input', e => {
  const ta = e.target.closest && e.target.closest('textarea[data-note]');
  if(!ta) return;
  S.notes[ta.dataset.note] = ta.value.slice(0, NOTE_LIMIT);
  saveSoon();
  const st = $('#note-status');
  if(st) st.textContent = 'Сохранено автоматически';
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches && t.matches('input[data-setting="autoAdvance"]')){
    S.autoAdvance = t.checked; save();
    return;
  }
  if(t.id === 'import-file'){
    const f = t.files && t.files[0];
    if(!f) return;
    if(f.size > 5 * 1024 * 1024){ toast('Файл слишком большой'); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      let next;
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('неверная структура');
        next = sanitizeState(parsed);
      }catch(err){
        toast('Не удалось прочитать файл: ' + err.message);
        return;
      }
      const ok = await confirmDialog(`Заменить текущие данные данными из файла? Результатов в файле: ${next.results.length}.`, 'Заменить');
      if(!ok) return;
      S = next; save(); go({name:'home'}); toast('Данные импортированы');
    };
    reader.onerror = () => toast('Не удалось прочитать файл');
    reader.readAsText(f);
  }
});

document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  if(e.target.matches && e.target.matches('textarea, input, select')) return;
  const dlg = $('#dlg'); if(dlg && dlg.open) return;
  if(route.name !== 'test') return;
  const test = getTest(route.id);
  if(!test) return;

  if(test.kind === 'tournament'){
    const st = tournamentState((S.answers[test.id] && S.answers[test.id].picks) || []);
    if(!st.done && (e.key === '1' || e.key === '2')){ e.preventDefault(); motivePick(test, st.current[Number(e.key) - 1]); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); motiveBack(test); }
    return;
  }
  if(!isQuestionTest(test)) return;

  if(e.key === 'ArrowLeft'){ e.preventDefault(); moveQ(test, route.q - 1); return; }
  if(e.key === 'ArrowRight'){ e.preventDefault(); moveQ(test, route.q + 1); return; }

  const n = Number(e.key);
  if(!Number.isInteger(n) || n < 1) return;
  if(test.kind === 'binary' && n <= 2){ e.preventDefault(); answerQuestion(test, n === 1 ? 'yes' : 'no'); }
  else if(test.kind === 'pairs' && n <= 2){ e.preventDefault(); answerQuestion(test, n === 1 ? 'a' : 'b'); }
  else if(test.kind === 'choice' && n <= 3){ e.preventDefault(); answerQuestion(test, String(n - 1)); }
});

/* ============================================================
   7. СТАРТ
   ============================================================ */
route = hashToRoute(location.hash);
normalizeRoute();
render({enter:true});
</script>

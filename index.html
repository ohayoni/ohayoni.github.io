/* ===== Спокойная редакционная подача карточек ===== */
.grid-cards{gap:14px}
.test-card{
  min-width:0;
  padding:20px;
  gap:15px;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:none;
  background:var(--card);
  transition:border-color .16s ease,background-color .16s ease;
}
.test-card:hover{
  border-color:var(--ring);
  transform:none;
  box-shadow:0 2px 8px rgb(0 0 0 / .035);
}
.test-card .tc-icon{
  width:36px;
  height:36px;
  border-radius:8px;
  background:var(--muted);
  border:1px solid var(--border);
  color:var(--muted-fg);
}
.test-card .tc-icon .ico{width:19px;height:19px;stroke-width:1.8}
.test-card h3{
  font-size:15.5px;
  line-height:1.35;
  font-weight:600;
  letter-spacing:-.012em;
}
.test-card .tc-meta{
  margin-top:5px;
  font-size:11.5px;
  line-height:1.45;
  color:var(--muted-fg);
}
.test-card .tc-body{
  font-size:13.25px;
  line-height:1.55;
  color:var(--muted-fg);
}
.test-card>.row:last-child{margin-top:auto;padding-top:2px}
.test-card.is-new{
  isolation:auto;
  border:1px solid color-mix(in srgb,var(--chart-2) 38%,var(--border));
  background:var(--card);
  box-shadow:none;
  animation:none;
}
.test-card.is-new:hover{
  border-color:color-mix(in srgb,var(--chart-2) 58%,var(--border));
  transform:none;
  box-shadow:0 2px 8px rgb(0 0 0 / .035);
}
.test-card.is-new .tc-icon{
  background:var(--muted);
  border-color:var(--border);
  color:var(--muted-fg);
}
.badge-new{
  background:color-mix(in srgb,var(--chart-2) 8%,var(--card));
  color:var(--fg);
  border:1px solid color-mix(in srgb,var(--chart-2) 24%,var(--border));
  border-radius:5px;
  padding:2px 8px;
  font-size:10.5px;
  line-height:1.45;
  font-weight:500;
  letter-spacing:.015em;
}
.badge-new .ico{display:none}
#app.enter .test-card.is-new{animation:fadeUp .22s ease both}

.grid-cats{gap:14px}
.cat-card{
  padding:19px 20px;
  gap:14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  box-shadow:none;
  transition:border-color .16s ease,background-color .16s ease;
}
.cat-card:before{display:none}
.cat-card:hover{
  transform:none;
  border-color:var(--ring);
  background:var(--muted);
  box-shadow:none;
}
.cat-icon{
  width:42px;
  height:42px;
  border-radius:9px;
  background:var(--muted);
  color:var(--muted-fg);
  border:1px solid var(--border);
}
.cat-icon .ico{width:21px;height:21px;stroke-width:1.8}
.cat-title{font-size:16px;font-weight:600;letter-spacing:-.012em}
.cat-desc{font-size:12.5px;line-height:1.5}
.cat-foot{
  display:grid;
  grid-template-columns:auto auto;
  justify-content:start;
  align-items:center;
  gap:7px 10px;
  margin-top:5px;
}
.cat-count{font-size:11.5px}
.cat-foot .badge-new{font-size:10px}
.cat-bar{grid-column:1 / -1;width:100%;height:3px;background:var(--muted)}
.cat-bar i{background:var(--muted-fg)}
.cat-arrow{color:var(--muted-fg)}
.cat-arrow .ico{width:18px;height:18px}
@media(max-width:620px){
  .test-card{padding:17px;gap:13px}
  .cat-card{padding:16px}
}

/* Новинки: только спокойный перелив тонкой обводки, без свечения и пульсации */
.test-card.is-new{
  border:1.5px solid transparent;
  background:
    linear-gradient(var(--card),var(--card)) padding-box,
    linear-gradient(110deg,
      color-mix(in srgb,var(--chart-1) 34%,var(--border)),
      color-mix(in srgb,var(--chart-2) 40%,var(--border)),
      color-mix(in srgb,var(--chart-3) 34%,var(--border)),
      color-mix(in srgb,var(--chart-1) 34%,var(--border))
    ) border-box;
  background-size:100% 100%,240% 100%;
  background-position:0 0,0% 50%;
  animation:newGradientBorder 6s linear infinite;
}
.test-card.is-new:hover{border-color:transparent}
@keyframes newGradientBorder{
  from{background-position:0 0,0% 50%}
  to{background-position:0 0,100% 50%}
}
#app.enter .test-card.is-new{animation:fadeUp .22s ease both,newGradientBorder 6s linear infinite}
@media(prefers-reduced-motion:reduce){.test-card.is-new{animation:none!important}}
</style>

<script>
(()=>{const I=(t,e=document)=>e.querySelector(t),o=t=>String(t??"").replace(/[&<>"']/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[e]),Me=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36),be=t=>{const e=new Date(t);return isNaN(e)?"":e.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})},X=(t,e,s)=>Math.max(e,Math.min(s,t)),ie=(t,e,s,a)=>`<button class="btn ${t} btn-sm btn-collapse" ${e} aria-label="${o(s)}" title="${o(s)}"><span class="btn-label">${o(s)}</span>${v(a)}</button>`,v=(t,e="")=>`<svg class="ico ${e}" aria-hidden="true" focusable="false"><use href="#i-${t}"/></svg>`,K=(t,e)=>e<=0?0:X(Math.round(t/e*100),0,100),pt=[{key:"PD",name:"Предметно-действенное",short:"П-Д",color:"var(--chart-1)"},{key:"AS",name:"Абстрактно-символическое",short:"А-С",color:"var(--chart-2)"},{key:"SL",name:"Словесно-логическое",short:"С-Л",color:"var(--chart-3)"},{key:"NO",name:"Наглядно-образное",short:"Н-О",color:"var(--chart-4)"},{key:"K",name:"Креативность",short:"К",color:"var(--chart-5)"}],ut={PD:"Вам проще понять через действие: потрогать, сделать, попробовать. Хорошая координация. Подойдёт работа руками, за рулём, спорт, танцы, сцена.",AS:"Формулы, коды, схемы — всё, что нельзя потрогать, — даётся легко. Так мыслят математики, программисты, аналитики, экономисты.",SL:"Умеете точно сформулировать мысль и донести её до людей. Сильная сторона преподавателей, переводчиков, журналистов, писателей.",NO:"Богатое воображение: легко представляете то, чего ещё нет. На этом держится работа художников, дизайнеров, архитекторов, режиссёров.",K:"Ищете нестандартные решения и не боитесь пробовать по-новому. Редкое качество — и заменить его нечем."},mt=[["Мне легче что-либо сделать самому, чем объяснить другому.","PD"],["Мне интересно составлять компьютерные программы.","AS"],["Я люблю читать книги.","SL"],["Мне нравится живопись, скульптура, архитектура.","NO"],["Даже в отлаженном деле я стараюсь что-то улучшить.","K"],["Я лучше понимаю, если мне объясняют на предметах или рисунках.","PD"],["Я люблю играть в шахматы.","AS"],["Я легко излагаю свои мысли как в устной, так и в письменной форме.","SL"],["Когда я читаю книгу, я чётко вижу её героев и описываемые события.","NO"],["Я предпочитаю самостоятельно планировать свою работу.","K"],["Мне нравится всё делать своими руками.","PD"],["В детстве я создавал(а) свой шифр для переписки с друзьями.","AS"],["Я придаю большое значение сказанному слову.","SL"],["Знакомые мелодии вызывают у меня в голове определённые картины.","NO"],["Разнообразные увлечения делают жизнь человека богаче и ярче.","K"],["При решении задачи мне легче идти методом проб и ошибок.","PD"],["Мне интересно разбираться в природе физических явлений.","AS"],["Мне интересна работа ведущего теле-радиопрограмм, журналиста.","SL"],["Мне легко представить предмет или животное, которых нет в природе.","NO"],["Мне больше нравится процесс деятельности, чем сам результат.","K"],["Мне нравилось в детстве собирать конструктор из деталей, лего.","PD"],["Я предпочитаю точные науки (математику, физику).","AS"],["Меня восхищает точность и глубина некоторых стихов.","SL"],["Знакомый запах вызывает в моей памяти прошлые события.","NO"],["Я не хотел(а) бы подчинять свою жизнь определённой системе.","K"],["Когда я слышу музыку, мне хочется танцевать.","PD"],["Я понимаю красоту математических формул.","AS"],["Мне легко говорить перед любой аудиторией.","SL"],["Я люблю посещать выставки, спектакли, концерты.","NO"],["Я сомневаюсь даже в том, что для других очевидно.","K"],["Я люблю заниматься рукоделием, что-то мастерить.","PD"],["Мне интересно было бы расшифровать древние тексты.","AS"],["Я легко усваиваю грамматические конструкции языка.","SL"],["Красота для меня важнее, чем польза.","NO"],["Не люблю ходить одним и тем же путём.","K"],["Истинно только то, что можно потрогать руками.","PD"],["Я легко запоминаю формулы, символы, условные обозначения.","AS"],["Друзья любят слушать, когда я им что-то рассказываю.","SL"],["Я легко могу представить в образах содержание рассказа или фильма.","NO"],["Я не могу успокоиться, пока не доведу свою работу до совершенства.","K"]],ht=[{key:"I",name:"Склонность к работе с людьми",color:"var(--chart-1)",short:"I"},{key:"II",name:"Исследовательская (интеллектуальная) работа",color:"var(--chart-2)",short:"II"},{key:"III",name:"Практическая деятельность",color:"var(--chart-3)",short:"III"},{key:"IV",name:"Эстетические виды деятельности",color:"var(--chart-4)",short:"IV"},{key:"V",name:"Экстремальные виды деятельности",color:"var(--chart-5)",short:"V"},{key:"VI",name:"Планово-экономические виды деятельности",color:"var(--chart-6)",short:"VI"}],vt={I:"Интересно работать с людьми: управлять, учить, лечить, обслуживать, консультировать. Легко находите общий язык с разными людьми.",II:"Нравится разбираться, как всё устроено. Рассуждаете логично, цените самостоятельность. Ваш путь — наука и исследования.",III:"По душе практическое дело: собирать, чинить, настраивать, строить, водить технику, делать вещи руками.",IV:"Тянет к творчеству: рисовать, писать, играть музыку, выступать. Цените оригинальность и независимость.",V:"Нужны движение, риск и живая работа: спорт, путешествия, экспедиции, охрана, армия, работа в поле и с природой. Требует выносливости и силы воли.",VI:"Нравятся порядок и расчёт: считать, планировать, вести документы, работать с текстами и чертежами. Подойдёт работа бухгалтера, экономиста, редактора."},bt=[{t:"Мне хотелось бы в своей профессиональной деятельности",o:[{text:"общаться с самыми разными людьми",m:"I"},{text:"снимать фильмы, писать книги, рисовать, выступать на сцене и т.д.",m:"IV"},{text:"заниматься расчётами; вести документацию",m:"VI"}]},{t:"В книге или кинофильме меня больше всего привлекает",o:[{text:"возможность следить за ходом мыслей автора",m:"II"},{text:"художественная форма, мастерство писателя или режиссёра",m:"IV"},{text:"сюжет, действия героев, приключения и погони",m:"V"}]},{t:"Меня больше обрадует Нобелевская премия",o:[{text:"за общественную деятельность",m:"I"},{text:"в области науки",m:"II"},{text:"в области искусства",m:"IV"}]},{t:"Я скорее соглашусь стать",o:[{text:"главным механиком",m:"III"},{text:"начальником экспедиции",m:"V"},{text:"главным бухгалтером",m:"VI"}]},{t:"Будущее людей определяют",o:[{text:"взаимопонимание между людьми",m:"I"},{text:"научные открытия",m:"II"},{text:"развитие производства",m:"III"}]},{t:"Если я стану руководителем, то в первую очередь займусь",o:[{text:"созданием дружного, сплочённого коллектива",m:"I"},{text:"разработкой новых технологий обучения",m:"II"},{text:"работой с документами",m:"VI"}]},{t:"На технической выставке меня больше привлечёт",o:[{text:"внутреннее устройство экспонатов",m:"II"},{text:"их практическое применение",m:"III"},{text:"внешний вид экспонатов (цвет, форма)",m:"IV"}]},{t:"В людях я ценю, прежде всего",o:[{text:"дружелюбие и отзывчивость",m:"I"},{text:"смелость и выносливость",m:"V"},{text:"обязательность и аккуратность",m:"VI"}]},{t:"В свободное время мне хотелось бы",o:[{text:"ставить различные опыты, эксперименты",m:"II"},{text:"писать стихи, сочинять музыку или рисовать",m:"IV"},{text:"тренироваться",m:"V"}]},{t:"В заграничных поездках меня скорее заинтересует",o:[{text:"возможность знакомства с историей и культурой другой страны",m:"IV"},{text:"экстремальный туризм (альпинизм, виндсерфинг, горные лыжи)",m:"V"},{text:"деловое общение",m:"VI"}]},{t:"Мне интереснее беседовать о",o:[{text:"человеческих взаимоотношениях",m:"I"},{text:"новой научной гипотезе",m:"II"},{text:"технических характеристиках новой модели машины, компьютера",m:"III"}]},{t:"Если бы в моей школе было всего три кружка, я бы выбрал(а)",o:[{text:"технический",m:"III"},{text:"музыкальный",m:"IV"},{text:"спортивный",m:"V"}]},{t:"В школе следует обратить особое внимание на",o:[{text:"улучшение взаимопонимания между учителями и учениками",m:"I"},{text:"поддержание здоровья учащихся, занятия спортом",m:"V"},{text:"укрепление дисциплины",m:"VI"}]},{t:"Я с большим удовольствием смотрю",o:[{text:"научно-популярные фильмы",m:"II"},{text:"программы о культуре и искусстве",m:"IV"},{text:"спортивные программы",m:"V"}]},{t:"Мне хотелось бы работать",o:[{text:"с детьми или сверстниками",m:"I"},{text:"с машинами, механизмами",m:"III"},{text:"с объектами природы в экспедициях в горах, пустынях",m:"V"}]},{t:"Школа в первую очередь должна",o:[{text:"учить общению с другими людьми",m:"I"},{text:"давать знания",m:"III"},{text:"обучать навыкам работы",m:"VI"}]},{t:"Главное в жизни",o:[{text:"иметь возможность заниматься творчеством",m:"IV"},{text:"вести здоровый образ жизни",m:"V"},{text:"тщательно планировать свои дела",m:"VI"}]},{t:"Государство должно в первую очередь заботиться о",o:[{text:"защите интересов и прав граждан",m:"I"},{text:"достижениях в области науки и техники",m:"II"},{text:"материальном благополучии граждан",m:"III"}]},{t:"Мне больше всего нравятся уроки",o:[{text:"труда",m:"III"},{text:"физкультуры",m:"V"},{text:"математики",m:"VI"}]},{t:"Мне интереснее было бы",o:[{text:"заниматься сбытом товаров",m:"I"},{text:"изготавливать изделия",m:"III"},{text:"планировать производство товаров",m:"VI"}]},{t:"Я предпочитаю читать статьи о",o:[{text:"выдающихся учёных и их открытиях",m:"II"},{text:"интересных изобретениях",m:"III"},{text:"жизни и творчестве писателей, художников, музыкантов",m:"IV"}]},{t:"В свободное время я люблю",o:[{text:"читать, думать, рассуждать",m:"II"},{text:"что-нибудь мастерить, шить, ухаживать за животными, растениями",m:"III"},{text:"ходить на выставки, концерты, в музеи",m:"IV"}]},{t:"Больший интерес у меня вызовет сообщение о",o:[{text:"научном открытии",m:"II"},{text:"художественной выставке",m:"IV"},{text:"экономической ситуации",m:"VI"}]},{t:"Я предпочту работать",o:[{text:"в помещении, где много людей",m:"I"},{text:"в необычных условиях",m:"V"},{text:"в обычном кабинете",m:"VI"}]}],ft=[{key:"demo",name:"Демонстративная",mult:2,yes:[7,19,22,29,41,44,63,66,73,85,88],no:[51],desc:"Жизнерадостны, общительны, любите быть в центре внимания. Тянетесь к лидерству, артистичны, мыслите нестандартно.",stress:"Скучная рутина, где нельзя проявить себя, и отсутствие зрителей."},{key:"stuck",name:"Застревающая",mult:2,yes:[2,15,24,34,37,56,68,78,81],no:[12,46,59],desc:"Основательны и принципиальны, но можете быть обидчивы и долго помнить обиды. Склонны к нравоучениям.",stress:"Несправедливость, обиды и ситуации, которые идут вразрез с вашими ценностями."},{key:"pedant",name:"Педантичная",mult:2,yes:[4,14,17,26,39,48,58,61,70,80,83],no:[36],desc:"Добросовестны, пунктуальны, аккуратны. Иногда уходите в формализм и перфекционизм.",stress:"Высокая ответственность, перфекционизм и сомнения в своих силах."},{key:"exc",name:"Возбудимая",mult:3,yes:[8,20,30,42,52,64,74,86],no:[],desc:"Обычно реагируете неторопливо, но в сильном возбуждении можете вспылить и стать резким.",stress:"Вспышки эмоций, с которыми трудно справиться. Быстро накатывают и так же быстро проходят."},{key:"hyper",name:"Гипертимическая",mult:3,yes:[1,11,23,33,45,55,67,77],no:[],desc:"Оптимист: энергичны, общительны, полны инициативы и хотите вести за собой. Иногда — легкомыслие и конфликтность.",stress:"Жёсткие рамки, монотонная работа, невозможность проявить инициативу и более сильный лидер рядом."},{key:"dist",name:"Дистимическая",mult:3,yes:[9,21,43,75,87],no:[31,53,65],desc:"Серьёзны и немногословны, склонны к пессимизму и замкнутости. Мыслите неспешно, самооценка часто занижена.",stress:"Ситуации, где нужны быстрые решения и бурная активность, и резкие перемены в жизни."},{key:"anx",name:"Тревожная",mult:3,yes:[16,27,38,49,60,71,82],no:[5],desc:"Осторожны и неуверенны в себе, склонны тревожиться и робеть. Часто сомневаетесь в своей ценности.",stress:"Общение с людьми, насмешки и сравнение себя с другими."},{key:"cycl",name:"Циклоидная",mult:3,yes:[6,18,28,40,50,62,72,84],no:[],desc:"Настроение часто меняется, иногда без причины, и от него зависит, как вы общаетесь и ведёте себя.",stress:"Мелочи, которые резко меняют настроение."},{key:"exalt",name:"Экзальтированная",mult:6,yes:[10,32,54,76],no:[],desc:"Мечтатель, немного живёте в своём мире. Приветливы, разговорчивы, дружелюбны, избегаете конфликтов.",stress:"Расхождение между реальностью и вашими ожиданиями от мира."},{key:"emo",name:"Эмотивная",mult:3,yes:[3,13,35,47,57,69,79],no:[25],desc:"Очень чувствительны и глубоко переживаете неприятности. Комфортнее всего с близкими; умеете сопереживать.",stress:"Острая реакция на чужое мнение, открытость эмоциям и чужой боли."}],$t=["У вас чаще весёлое и беззаботное настроение?","Вы чувствительны к оскорблениям?","Бывает ли так, что вам на глаза навертываются слёзы в кино, театре, беседе и так далее?","Сделав что-то, вы сомневаетесь, всё ли сделано правильно, и не успокаиваетесь до тех пор, пока не убедитесь в том, что всё сделано правильно?","Считаете ли вы себя более смелым, чем в детском возрасте?","Часто ли у вас резко меняется настроение от состояния безграничного ликования до отвращения к жизни, к себе?","Являетесь ли вы обычно центром внимания в обществе, компании?","Бывает ли так, что вы беспричинно находитесь в таком ворчливом, угрюмом состоянии, что с вами лучше не разговаривать?","Вы серьёзный человек?","Способны ли вы восторгаться, восхищаться чем-нибудь?","Предприимчивы ли вы?","Вы быстро забываете, если вас кто-либо обидит?","Мягкосердечны ли вы?","Опуская письмо в почтовый ящик, проверяете ли вы, проводя рукой по щели ящика, что письмо полностью упало в него?","Всегда ли вы стараетесь быть добросовестным в работе?","Бывало ли вам страшно в детстве во время грозы или при встрече с незнакомой собакой?","Стремитесь ли вы во всём и всюду соблюдать порядок?","Зависит ли ваше настроение от внешних обстоятельств?","Любят ли вас ваши знакомые?","Часто ли у вас бывает чувство внутреннего беспокойства, ощущение возможной беды, неприятности?","Часто ли ваше настроение бывает подавленным?","Бывали ли у вас хотя бы раз истерика или нервный срыв?","Трудно ли вам долго усидеть на одном месте?","Если по отношению к вам несправедливо поступили, энергично ли вы отстаиваете свои интересы?","Можете ли вы зарезать курицу или овцу?","Раздражает ли вас, если дома занавеска или скатерть висят неровно, и вы сразу же стараетесь поправить их?","Вы в детстве боялись оставаться одни в доме?","Часто ли у вас бывают колебания настроения без причины?","Всегда ли вы старательно относитесь к своей деятельности?","Быстро ли вы начинаете сердиться и впадать в гнев?","Можете ли вы быть абсолютно беззаботно весёлым?","Бывает ли так, что ощущение полного счастья буквально пронизывает вас?","Как вы думаете, получился бы из вас ведущий увеселительного мероприятия, тамада?","Вы обычно высказываете своё мнение людям достаточно откровенно, прямо и недвусмысленно?","Вам трудно переносить вид крови?","Любите ли вы работу с высокой личной ответственностью?","Склонны ли вы вступиться за человека, с которым поступили несправедливо?","Трудно ли вам входить/спускаться в тёмный подвал?","Выполняете ли вы кропотливую работу так же медленно и тщательно, как и любимое вами дело?","Общительны ли вы?","В школе вы охотно декламировали стихи?","Убегали ли вы в детстве из дома?","Кажется ли вам жизнь трудной?","Бывает ли так, что после конфликта, обиды вы были до того расстроены, что идти на работу казалось просто невыносимым?","Можно ли сказать, что при неудаче вы не теряете чувства юмора?","Предприняли бы вы первые шаги к примирению, если бы вас кто-либо обидел?","Любите ли вы животных?","Уйдёте ли вы с работы или из дома, если у вас там что-то не в порядке?","Преследует ли вас иногда неясная мысль, что с вами или вашими близкими может случиться что-то страшное?","Считаете ли вы, что ваше настроение очень изменчиво?","Трудно ли вам докладывать (выступать на сцене) перед большим количеством людей?","Вы можете ударить обидчика, если он вас оскорбит?","У вас велика потребность в общении с другими людьми?","Если вы бу ошие отношения.","Я легко подстраиваюсь под разных людей и поддерживаю их.","Мне нравится создавать тёплую атмосферу в коллективе.","Я поддержу команду и постараюсь снять напряжение.","Мне трудно настаивать на своём, если это грозит конфликтом."]},{key:"RI",name:"Исследователь ресурсов",sub:"разведчик",code:"АВЕЖДЗГ",color:"var(--chart-7)",alias:"Resource Investigator · разведчик · нетворкер",desc:"Общительный и любознательный: приносит в группу идеи, контакты и возможности извне.",use:"Отправлять искать контакты, ресурсы, партнёров и новые возможности за пределами команды.",weak:"Быстро остывает и бывает чрезмерно оптимистичен.",s:["Я быстро замечаю новые возможности и умею ими воспользоваться.","Я быстро теряю интерес, когда новизна проходит.","Я охотно ищу контакты и ресурсы за пределами группы.","Я люблю знакомиться и находить полезные связи.","Мне нравится исследовать новое и налаживать контакты.","Я быстро найду нужных людей и недостающие ресурсы.","Я многое начинаю, но не всё довожу до конца."]},{key:"CF",name:"Финишер",sub:"доводящий дело до конца",code:"ДЗБЕЖГВ",color:"var(--chart-8)",alias:"Completer Finisher · доводчик · контролёр качества",desc:"Скрупулёзный и ответственный: ловит ошибки, следит за сроками и не пропускает мелочей.",use:"Подключать на финале: проверка деталей, сроки, качество и доведение работы до готового результата.",weak:"Склонен тревожиться и с трудом делегирует.",s:["Моя результативность держится на умении доводить дело до конца.","Я не отпускаю дело, пока всё не проверено, и мне трудно передавать работу другим.","Я проверяю, чтобы ничего не было упущено и сроки были соблюдены.","Я аккуратен(на) в деталях и ценю точность.","Мне нравится доводить работу до совершенства.","Я прослежу, чтобы всё было сделано в срок и без ошибок.","Мне трудно доверять другим и делегировать мелочи."]}],wt=Be.map((t,e)=>{const s=new Array(8);return De.forEach(a=>{s[Ve.indexOf(a.code[e])]={text:a.s[e],role:a.key}}),s}),ge=t=>t.filter(e=>e.value===t[0].value
